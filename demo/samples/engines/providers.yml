# Grok or Gemini in place of Claude. Layer it on any Compose file whose UAG
# service is `formio-uag`, such as ../custom-module:
#
#   docker compose -f docker-compose.yml -f ../engines/providers.yml up -d
#
# Set PROVIDER_ENGINE in .env to grok or gemini, and that provider's
# variables (all of them can stay in .env; only the named engine is enabled):
#   grok    XAI_API_KEY, XAI_MODEL
#   gemini  GEMINI_API_KEY, GEMINI_MODEL
services:
  formio-uag:
    # Real engines need a LICENSE_KEY that includes the UAG, or a hosted project.
    environment:
      LICENSE_KEY: ${LICENSE_KEY:-}
      UAG_ENGINES: ${PROVIDER_ENGINE:?set PROVIDER_ENGINE in .env to grok or gemini}
      XAI_API_KEY: ${XAI_API_KEY:-}
      XAI_MODEL: ${XAI_MODEL:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      CLAUDE_API_KEY: ""
