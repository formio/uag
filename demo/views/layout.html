<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{page.fullTitle}}</title>
  <meta name="description" content="{{page.description}}">
  <link rel="canonical" href="{{page.canonical}}">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Form.io Agentic Forms">
  <meta property="og:title" content="{{page.fullTitle}}">
  <meta property="og:description" content="{{page.description}}">
  <meta property="og:url" content="{{page.canonical}}">
  <meta property="og:image" content="{{site.url}}/images/og-uag.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/png" href="/images/brand/favicon.png">
  <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/site.css?v={{assetVersion}}">
</head>
<body class="{{page.bodyClass}}" data-uag-url="{{uag.url}}" data-uag-project-url="{{uag.projectUrl}}" data-project-url="{{projectUrl}}" data-formio-base-url="{{formioBaseUrl}}" data-production="{{production}}">
  <a class="skip" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="container">
      <a class="brand" href="/" aria-label="Form.io Agentic Forms, home">
        <img src="/images/brand/logo-formio-horizontal-lightbg.svg" alt="Form.io" width="110" height="30">
        <span class="brand-product">Agentic Forms</span>
      </a>
      <nav class="nav" aria-label="Main">
        <a href="/" {{{nav.product}}}>Product</a>
        <a href="/getting-started" {{{nav.start}}}>Getting Started</a>
        <a href="/examples" {{{nav.examples}}}>Examples</a>
        <a href="/developers" {{{nav.developers}}}>Developers</a>
      </nav>
      <button class="menu-toggle" type="button" aria-label="Menu" aria-expanded="false"><span></span><span></span><span></span></button>
    </div>
  </header>

  <main id="main">
{{{content}}}
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© {{site.year}} Form.io LLC. All rights reserved. The UAG and the Agentic Coding Plugin are open source under the MIT license.</p>
    </div>
  </footer>
  <script src="/js/site.js?v={{assetVersion}}" defer></script>
</body>
</html>
