<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-labelledby="t d">
  <title id="t">The demo site: static pages that call the UAG</title>
  <desc id="d">A visitor's browser loads the site's static pages from CloudFront, which reads them from a private S3 bucket. When the visitor starts a demo, the page registers a guest user at the demo's Form.io project, https://uag.form.io, and keeps the guest's token; the page also loads its forms from the project. With that token, the page calls the UAG directly: it loads @formio/uag-js from the UAG, calls the Agent API (the chat's turns, the claim's extraction, the lease's document processing), and saves the chat's requests, the workflow's applications and the claims through it. The UAG allows the site's origin only, runs the JEV and Claude engines inside it and calls their APIs, and forwards every save to the project with the guest's token, where the Agent: Run task actions' results are saved too. A scheduled job deletes guests and their submissions after a day. The site has no server of its own.</desc>
  <defs>
    <style>
      text { font-family: Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #0c141d; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .h { font-size: 14px; font-weight: 700; }
      .s { font-size: 11.5px; fill: #566073; }
      .lab { font-size: 11px; font-weight: 700; letter-spacing: .08em; fill: #8d99a8; }
      .e { font-size: 11px; fill: #3f7a22; font-weight: 600; }
      .g { font-size: 11px; fill: #566073; }
      .w { fill: #fff; }
      .card { fill: #fff; stroke: #d7dde5; stroke-width: 1.2; }
      .zone { fill: #f6f8fa; stroke: #e0e5ec; stroke-width: 1; }
      .dark { fill: #2c3540; }
      .chip { fill: #f1f4f7; stroke: #d7dde5; stroke-width: 1; }
      .flow { stroke: #69b342; stroke-width: 2.2; fill: none; }
      .soft { stroke: #9aa6b4; stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; }
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#69b342"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9aa6b4"/></marker>
  </defs>
  <rect x="1" y="1" width="998" height="428" rx="18" fill="#fff" stroke="#e0e5ec"/>

  <!-- The site -->
  <rect x="24" y="24" width="300" height="132" rx="14" class="zone"/>
  <text x="44" y="48" class="lab">THE SITE · STATIC FILES</text>
  <rect x="44" y="62" width="120" height="74" rx="10" class="card"/>
  <text x="104" y="92" text-anchor="middle" class="h">S3</text>
  <text x="104" y="110" text-anchor="middle" class="s">private bucket</text>
  <text x="104" y="125" text-anchor="middle" class="s mono">yarn demo:build</text>
  <path d="M166 99 H186" class="soft" marker-end="url(#b)"/>
  <rect x="188" y="62" width="120" height="74" rx="10" class="card"/>
  <text x="248" y="92" text-anchor="middle" class="h">CloudFront</text>
  <text x="248" y="110" text-anchor="middle" class="s">ai.form.io</text>
  <text x="248" y="125" text-anchor="middle" class="s">CSP, clean URLs</text>

  <!-- Browser -->
  <rect x="24" y="200" width="300" height="206" rx="14" class="dark"/>
  <text x="44" y="226" class="lab" style="fill:#8d99a8">THE VISITOR'S BROWSER</text>
  <text x="44" y="252" class="h w">The demo pages</text>
  <text x="44" y="274" class="s" style="fill:#c9d2dc">formio.js, and @formio/uag-js</text>
  <text x="44" y="290" class="s" style="fill:#c9d2dc">loaded from the UAG</text>
  <rect x="44" y="306" width="260" height="34" rx="8" fill="#3a4654"/>
  <text x="58" y="327" class="g" style="fill:#e6ebf0">guest token · <tspan class="mono">Formio.setToken()</tspan></text>
  <rect x="44" y="350" width="260" height="38" rx="8" fill="#3a4654"/>
  <text x="58" y="366" class="g" style="fill:#e6ebf0">flow log: each call the page makes,</text>
  <text x="58" y="381" class="g" style="fill:#e6ebf0">with the engines that answered</text>
  <path d="M248 138 V196" class="flow" marker-end="url(#a)"/>
  <text x="240" y="172" text-anchor="end" class="e">pages, scripts</text>

  <!-- The UAG -->
  <rect x="452" y="200" width="300" height="206" rx="14" class="zone"/>
  <text x="472" y="226" class="lab">THE UAG · UAG.AI.FORM.IO</text>
  <rect x="472" y="240" width="260" height="70" rx="10" class="card"/>
  <text x="486" y="264" class="h">Universal Agent Gateway</text>
  <text x="486" y="283" class="s">CORS: the site's origin only</text>
  <text x="486" y="299" class="s">per-guest rate limits</text>
  <rect x="472" y="322" width="124" height="34" rx="8" class="chip"/>
  <text x="534" y="343" text-anchor="middle" class="g">JEV engine</text>
  <rect x="608" y="322" width="124" height="34" rx="8" class="chip"/>
  <text x="670" y="343" text-anchor="middle" class="g">Claude engine</text>
  <text x="472" y="384" class="s">Agent: Run task, after each save</text>

  <path d="M326 262 H448" class="flow" marker-end="url(#a)"/>
  <text x="387" y="252" text-anchor="middle" class="e">Agent API, saves</text>
  <text x="387" y="280" text-anchor="middle" class="g">as the guest</text>

  <!-- Form.io -->
  <rect x="452" y="24" width="300" height="132" rx="14" class="zone"/>
  <text x="472" y="48" class="lab">FORM.IO · UAG.FORM.IO</text>
  <rect x="472" y="62" width="260" height="74" rx="10" class="card"/>
  <text x="486" y="86" class="h">The demo's project</text>
  <text x="486" y="105" class="s">the demos' forms, and guests:</text>
  <text x="486" y="121" class="s mono">guest/register</text>
  <path d="M300 214 C 380 170, 400 120, 468 104" class="flow" marker-end="url(#a)"/>
  <text x="362" y="104" text-anchor="middle" class="e">sign in as a guest,</text>
  <text x="362" y="119" text-anchor="middle" class="e">load the forms</text>
  <path d="M602 236 V140" class="flow" marker-end="url(#a)"/>
  <text x="610" y="190" class="e">saves, with</text>
  <text x="610" y="205" class="e">the guest's token</text>

  <!-- Models -->
  <rect x="820" y="296" width="156" height="74" rx="10" class="card"/>
  <text x="898" y="322" text-anchor="middle" class="h">Model APIs</text>
  <text x="898" y="340" text-anchor="middle" class="s">TypeSafe (JEV)</text>
  <text x="898" y="355" text-anchor="middle" class="s">Anthropic (Claude)</text>
  <path d="M754 339 H816" class="flow" marker-end="url(#a)"/>

  <!-- Retention -->
  <rect x="820" y="62" width="156" height="74" rx="10" class="card"/>
  <text x="898" y="88" text-anchor="middle" class="h">Retention</text>
  <text x="898" y="106" text-anchor="middle" class="s">hourly GitHub job:</text>
  <text x="898" y="121" text-anchor="middle" class="s">deletes after a day</text>
  <path d="M818 99 H756" class="soft" marker-end="url(#b)"/>
</svg>
