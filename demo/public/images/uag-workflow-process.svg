<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 560" role="img" aria-labelledby="t d">
  <title id="t">An agentic workflow, as a process</title>
  <desc id="d">A process in four lanes: the applicant, Form.io, the UAG and the engines. The applicant submits the application to the UAG, which forwards the create to Form.io, and Form.io saves it; the applicant gets the response at once. After the save, an Agent: Run task action on create starts the admissions task in the background: the UAG asks the engines to score the application against the rubric and saves their answers as an update through the UAG, which Form.io saves. The update runs the form's update actions. A gateway, the finance action's condition, checks whether status is scholarshipEvaluation and awardLevel is empty. If not, the process ends with the decision on file. If so, the finance Run task action, on update, asks the engines to choose the award, and the UAG saves it as an update, which ends the process with the award on file. No webhooks are involved.</desc>
  <defs>
    <style>
      text { font-family: Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #0c141d; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .lane { font-size: 14px; font-weight: 700; }
      .sub { font-size: 11px; fill: #566073; }
      .t { font-size: 12.5px; font-weight: 600; }
      .e { font-size: 11px; fill: #3f7a22; font-weight: 600; }
      .g { font-size: 11px; fill: #566073; }
      .w { fill: #fff; }
      .task { fill: #fff; stroke: #3a4756; stroke-width: 1.5; }
      .uag { fill: #edfae6; stroke: #69b342; stroke-width: 1.5; }
      .flow { stroke: #3a4756; stroke-width: 1.8; fill: none; }
      .call { stroke: #69b342; stroke-width: 2; fill: none; }
      .back { stroke: #8d99a8; stroke-width: 1.8; fill: none; stroke-dasharray: 5 4; }
    </style>
    <marker id="f" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3a4756"/></marker>
    <marker id="c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#69b342"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8d99a8"/></marker>
  </defs>
  <rect x="1" y="1" width="1178" height="558" rx="18" fill="#fff" stroke="#e0e5ec"/>

  <!-- Lanes -->
  <rect x="20" y="20" width="1140" height="480" rx="10" fill="none" stroke="#c9d2dc"/>
  <path d="M20 130 H1160 M20 250 H1160 M20 370 H1160" stroke="#c9d2dc"/>
  <path d="M130 20 V500" stroke="#c9d2dc"/>
  <rect x="21" y="21" width="109" height="109" fill="#f5f7fa"/>
  <rect x="21" y="131" width="109" height="119" fill="#f5f7fa"/>
  <rect x="21" y="251" width="109" height="119" fill="#edfae6"/>
  <rect x="21" y="371" width="109" height="128" fill="#f5f7fa"/>
  <text x="36" y="72" class="lane">Applicant</text>
  <text x="36" y="90" class="sub">a person</text>
  <text x="36" y="186" class="lane">Form.io</text>
  <text x="36" y="204" class="sub">stores the form's</text>
  <text x="36" y="218" class="sub">submissions</text>
  <text x="36" y="306" class="lane">UAG</text>
  <text x="36" y="324" class="sub">Agent: Run task</text>
  <text x="36" y="338" class="sub">actions</text>
  <text x="36" y="430" class="lane">Engines</text>
  <text x="36" y="448" class="sub">Claude, JEV</text>

  <!-- Applicant -->
  <circle cx="165" cy="80" r="14" fill="#fff" stroke="#3a4756" stroke-width="1.8"/>
  <path d="M179 80 H188" class="flow" marker-end="url(#f)"/>
  <rect x="192" y="53" width="120" height="54" rx="10" class="task"/>
  <text x="252" y="76" text-anchor="middle" class="t">Submit the</text>
  <text x="252" y="93" text-anchor="middle" class="t">application</text>

  <!-- UAG: forward the create -->
  <path d="M252 107 V279" class="call" marker-end="url(#c)"/>
  <text x="260" y="152" class="e">to the UAG</text>
  <rect x="192" y="283" width="120" height="54" rx="10" class="uag"/>
  <text x="252" y="306" text-anchor="middle" class="t">Forward</text>
  <text x="252" y="323" text-anchor="middle" class="t">the create</text>

  <!-- Form.io: save -->
  <path d="M312 310 H400 V221" class="call" marker-end="url(#c)"/>
  <rect x="340" y="163" width="120" height="54" rx="10" class="task"/>
  <text x="400" y="186" text-anchor="middle" class="t">Save the</text>
  <text x="400" y="203" text-anchor="middle" class="t">submission</text>
  <path d="M460 190 H560 V279" class="back" marker-end="url(#b)"/>
  <text x="468" y="180" class="g">saved; then, on create</text>

  <!-- UAG: admissions -->
  <rect x="500" y="283" width="120" height="54" rx="10" class="uag"/>
  <text x="560" y="306" text-anchor="middle" class="t">Run the</text>
  <text x="560" y="323" text-anchor="middle" class="t">admissions task</text>
  <path d="M545 337 V399" class="call" marker-end="url(#c)"/>
  <path d="M575 401 V341" class="back" marker-end="url(#b)"/>
  <text x="538" y="390" text-anchor="end" class="g">fields + rubric</text>
  <text x="582" y="390" class="g">answers</text>

  <rect x="500" y="403" width="120" height="54" rx="10" class="task"/>
  <text x="560" y="426" text-anchor="middle" class="t">Score against</text>
  <text x="560" y="443" text-anchor="middle" class="t">the rubric</text>

  <!-- UAG: save as an update -->
  <path d="M620 310 H646" class="flow" marker-end="url(#f)"/>
  <rect x="650" y="283" width="120" height="54" rx="10" class="uag"/>
  <text x="710" y="306" text-anchor="middle" class="t">Save as</text>
  <text x="710" y="323" text-anchor="middle" class="t">an update</text>
  <path d="M710 283 V221" class="call" marker-end="url(#c)"/>
  <text x="716" y="264" class="e">forwarded</text>

  <!-- Form.io: save the update -->
  <rect x="650" y="163" width="120" height="54" rx="10" class="task"/>
  <text x="710" y="186" text-anchor="middle" class="t">Save the update</text>
  <text x="710" y="203" text-anchor="middle" class="sub">scores, decision, status</text>

  <!-- Gateway: the finance action's condition, in the UAG -->
  <path d="M770 190 H790 V310 H802" class="back" marker-end="url(#b)"/>
  <path d="M830 286 L854 310 L830 334 L806 310 Z" fill="#fff" stroke="#3a4756" stroke-width="1.8"/>
  <text x="830" y="352" text-anchor="middle" class="g">on update: status ==</text>
  <text x="830" y="365" text-anchor="middle" class="g mono" style="font-size:10.5px">scholarshipEvaluation</text>
  <text x="830" y="378" text-anchor="middle" class="g">and awardLevel empty?</text>
  <path d="M830 286 V208" class="flow" marker-end="url(#f)"/>
  <text x="838" y="262" class="g">no</text>
  <circle cx="830" cy="190" r="14" fill="#fff" stroke="#3a4756" stroke-width="4"/>
  <text x="852" y="187" class="t" style="font-size:12px">Decision</text>
  <text x="852" y="202" class="t" style="font-size:12px">on file</text>

  <!-- UAG: finance -->
  <path d="M854 310 H876" class="flow" marker-end="url(#f)"/>
  <text x="857" y="302" class="g">yes</text>
  <rect x="880" y="283" width="120" height="54" rx="10" class="uag"/>
  <text x="940" y="306" text-anchor="middle" class="t">Run the</text>
  <text x="940" y="323" text-anchor="middle" class="t">finance task</text>
  <path d="M925 337 V399" class="call" marker-end="url(#c)"/>
  <path d="M955 401 V341" class="back" marker-end="url(#b)"/>
  <rect x="880" y="403" width="120" height="54" rx="10" class="task"/>
  <text x="940" y="426" text-anchor="middle" class="t">Choose</text>
  <text x="940" y="443" text-anchor="middle" class="t">the award</text>

  <!-- Form.io: save the award -->
  <path d="M1000 310 H1080 V221" class="call" marker-end="url(#c)"/>
  <text x="1006" y="300" class="e">as an update</text>
  <rect x="1020" y="163" width="120" height="54" rx="10" class="task"/>
  <text x="1080" y="186" text-anchor="middle" class="t">Save the</text>
  <text x="1080" y="203" text-anchor="middle" class="t">award</text>
  <path d="M1080 163 V98" class="flow" marker-end="url(#f)"/>
  <circle cx="1080" cy="80" r="14" fill="#fff" stroke="#3a4756" stroke-width="4"/>
  <text x="1102" y="77" class="t" style="font-size:12px">Award</text>
  <text x="1102" y="92" class="t" style="font-size:12px">on file</text>

  <!-- Legend -->
  <circle cx="34" cy="527" r="7" fill="#fff" stroke="#3a4756" stroke-width="1.6"/>
  <text x="48" y="531" class="g">start</text>
  <circle cx="98" cy="527" r="7" fill="#fff" stroke="#3a4756" stroke-width="3"/>
  <text x="112" y="531" class="g">end</text>
  <path d="M146 527 H174" class="flow" marker-end="url(#f)"/>
  <text x="182" y="531" class="g">next step</text>
  <path d="M252 520 L259 527 L252 534 L245 527 Z" fill="#fff" stroke="#3a4756" stroke-width="1.5"/>
  <text x="266" y="531" class="g">a Run task condition</text>
  <path d="M392 527 H420" class="call" marker-end="url(#c)"/>
  <text x="428" y="531" class="g">an HTTP call</text>
  <path d="M506 527 H534" class="back" marker-end="url(#b)"/>
  <text x="542" y="531" class="g">a response</text>
  <text x="1160" y="522" text-anchor="end" class="g">The applicant gets the response at once; both tasks run after the save, in the background.</text>
  <text x="1160" y="538" text-anchor="end" class="g">Saving the award checks the finance condition again; awardLevel is set, so it stops.</text>
</svg>
