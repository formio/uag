<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-labelledby="t d">
  <title id="t">Chaining tasks into a workflow</title>
  <desc id="d">The demo's college application runs two tasks. An applicant submits through the UAG, which forwards the save to Form.io. An Agent: Run task action on create, with task admissions and set to run after the save, starts in the background; engines score the application and decide its status; the UAG validates the answers and saves them as an update through the UAG, so the form's update actions run. A second Run task action, on update, with task finance and the condition that status is scholarshipEvaluation and awardLevel is empty, runs on that update. Engines choose an award level and the UAG saves it as an update. That update checks the finance condition again, but awardLevel is now set, so the condition is false and the chain ends. Accepted or declined applicants never meet the condition.</desc>
  <defs>
    <style>
      text { font-family: Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #0c141d; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .lab { font-size: 11px; font-weight: 700; letter-spacing: .08em; fill: #8d99a8; }
      .t { font-size: 13.5px; font-weight: 700; }
      .s { font-size: 12px; fill: #566073; }
      .code { font-size: 11.5px; fill: #3f7a22; font-weight: 600; }
      .w { fill: #ffffff; }
      .wm { fill: #c9d2dc; }
      .card { fill: #ffffff; stroke: #d7dde5; stroke-width: 1.2; }
      .flow { stroke: #69b342; stroke-width: 2.2; fill: none; }
      .end { stroke: #8d99a8; stroke-width: 2; fill: none; stroke-dasharray: 5 4; }
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#69b342"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8d99a8"/></marker>
  </defs>
  <rect x="1" y="1" width="998" height="418" rx="18" fill="#ffffff" stroke="#e0e5ec"/>

  <!-- Task 1 -->
  <text x="24" y="34" class="lab">TASK 1 · ADMISSIONS</text>
  <rect x="20" y="46" width="216" height="86" rx="10" class="card"/>
  <text x="36" y="72" class="t">Applicant submits</text>
  <text x="36" y="93" class="s">to the UAG, which forwards</text>
  <text x="36" y="110" class="s">the save to Form.io.</text>
  <path d="M238 89 h24" class="flow" marker-end="url(#a)"/>

  <rect x="266" y="46" width="216" height="86" rx="10" class="card"/>
  <text x="282" y="72" class="t">Run task, on create</text>
  <text x="282" y="94" class="mono code">task: "admissions"</text>
  <text x="282" y="112" class="mono code">when: "after"</text>
  <path d="M484 89 h24" class="flow" marker-end="url(#a)"/>

  <rect x="512" y="46" width="216" height="86" rx="10" class="card"/>
  <text x="528" y="72" class="t">Engines answer</text>
  <text x="528" y="93" class="s">Scores, an overall score,</text>
  <text x="528" y="110" class="s">a rationale, decision, status.</text>
  <path d="M730 89 h24" class="flow" marker-end="url(#a)"/>

  <rect x="758" y="46" width="222" height="86" rx="10" fill="#3a4756"/>
  <text x="774" y="72" class="t w">UAG saves as an update</text>
  <text x="774" y="93" class="s wm">Through the UAG, so the</text>
  <text x="774" y="110" class="s wm">form's update actions run.</text>

  <!-- Condition -->
  <path d="M869 134 V246" class="flow" marker-end="url(#a)"/>
  <rect x="444" y="156" width="404" height="70" rx="10" fill="#edfae6" stroke="#c9e8b4"/>
  <text x="460" y="180" class="t" style="font-size:13px">Second Run task, on update, with a condition</text>
  <text x="460" y="202" class="mono code">status == "scholarshipEvaluation"</text>
  <text x="460" y="218" class="mono code">and awardLevel is empty</text>
  <path d="M848 191 h18" stroke="#c9e8b4" stroke-width="2"/>

  <rect x="20" y="156" width="400" height="70" rx="10" fill="#f5f7fa" stroke="#e0e5ec"/>
  <text x="36" y="182" class="t" style="font-size:13px">Accepted or declined?</text>
  <text x="36" y="204" class="s">The condition is false, so the finance task never runs</text>
  <text x="36" y="220" class="s">and the workflow ends after one task.</text>

  <!-- Task 2, right to left -->
  <text x="852" y="244" text-anchor="end" class="lab">TASK 2 · FINANCE</text>
  <rect x="758" y="252" width="222" height="86" rx="10" class="card"/>
  <text x="774" y="278" class="t">Run task, on update</text>
  <text x="774" y="300" class="mono code">task: "finance"</text>
  <text x="774" y="318" class="mono code">when: "after"</text>
  <path d="M756 295 h-24" class="flow" marker-end="url(#a)"/>

  <rect x="512" y="252" width="216" height="86" rx="10" class="card"/>
  <text x="528" y="278" class="t">Engines answer</text>
  <text x="528" y="299" class="s">The award level and</text>
  <text x="528" y="316" class="s">its rationale.</text>
  <path d="M510 295 h-24" class="flow" marker-end="url(#a)"/>

  <rect x="266" y="252" width="216" height="86" rx="10" fill="#3a4756"/>
  <text x="282" y="278" class="t w">UAG saves as an update</text>
  <text x="282" y="299" class="s wm">The finance condition</text>
  <text x="282" y="316" class="s wm">is checked again.</text>
  <path d="M264 295 h-24" class="end" marker-end="url(#b)"/>

  <rect x="20" y="252" width="216" height="86" rx="10" fill="#f5f7fa" stroke="#e0e5ec"/>
  <text x="36" y="278" class="t">Chain ends</text>
  <text x="36" y="299" class="s">awardLevel is set now,</text>
  <text x="36" y="316" class="s">so the condition is false.</text>

  <text x="500" y="372" text-anchor="middle" class="s" style="font-weight:600;fill:#2a333e">No engine holds a write tool. The UAG saves each result itself, as an update.</text>
  <text x="500" y="394" text-anchor="middle" class="s">A run saves only what changed, and a condition on a field the task sets keeps the chain from looping.</text>
</svg>
