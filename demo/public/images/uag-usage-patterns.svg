<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="t d">
  <title id="t">Three ways to use the UAG</title>
  <desc id="d">Conversation forms: a person talks to an MCP client, whose model reads the form with get_forms, get_form_fields and get_field_info, sends answers with collect_field_data, and saves with submit_completed_form; or to the chat widget embedded in a page, whose turns are the form's {form}/agent/chat, answered by a UAG engine, and which submits the form through the UAG once the person confirms; no Agentic Formflow license. Agentic workflows: an applicant submits through the UAG, which forwards the save to Form.io; an Agent: Run task action then runs the task after the save, in the background; engines answer the task's fields; and the UAG saves the results as an update, whose update actions can run the next task. Agentic Formflow: a person describes what happened, @formio/uag-js calls the form's {form}/agent/extract, fast decisions usually arrive first so pages appear, then values follow as suggestions and nothing is saved until the person submits. Workflows and Formflow run models in the UAG's engines and need a UAG license or a hosted Form.io project.</desc>
  <defs>
    <style>
      text { font-family: Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #0c141d; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .h { font-size: 16px; font-weight: 700; fill: #ffffff; }
      .sub { font-size: 12.5px; fill: #c9d2dc; }
      .st { font-size: 13px; font-weight: 600; fill: #0c141d; }
      .s { font-size: 12px; fill: #566073; }
      .code { font-size: 11.5px; fill: #3f7a22; font-weight: 600; }
      .n { font-size: 11px; font-weight: 700; fill: #ffffff; }
      .k { font-size: 10.5px; font-weight: 700; letter-spacing: .06em; fill: #8d99a8; }
      .v { font-size: 12.5px; font-weight: 600; fill: #2a333e; }
      .card { fill: #ffffff; stroke: #d7dde5; stroke-width: 1.2; }
      .flow { stroke: #69b342; stroke-width: 2.2; fill: none; }
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#69b342"/></marker>
  </defs>
  <rect x="1" y="1" width="998" height="518" rx="18" fill="#ffffff" stroke="#e0e5ec"/>

  <!-- Column 1: Conversation forms -->
  <g transform="translate(20 20)">
    <rect width="304" height="66" rx="12" fill="#3a4756"/>
    <text x="16" y="28" class="h">Conversation forms</text>
    <text x="16" y="50" class="sub">A person talks. The agent fills the form.</text>

    <rect y="84" width="304" height="62" rx="10" class="card"/>
    <circle cx="22" cy="106" r="10" fill="#69b342"/><text x="22" y="110" text-anchor="middle" class="n">1</text>
    <text x="42" y="110" class="st">A person asks an agent, or a chat</text>
    <text x="42" y="132" class="s">“My internet's been down since last night.”</text>
    <path d="M152 148 V160" class="flow" marker-end="url(#a)"/>

    <rect y="164" width="304" height="62" rx="10" class="card"/>
    <circle cx="22" cy="186" r="10" fill="#69b342"/><text x="22" y="190" text-anchor="middle" class="n">2</text>
    <text x="42" y="190" class="st">A model reads the form</text>
    <text x="42" y="212" class="mono code">get_forms · … or {form}/agent/chat</text>
    <path d="M152 228 V240" class="flow" marker-end="url(#a)"/>

    <rect y="244" width="304" height="62" rx="10" class="card"/>
    <circle cx="22" cy="266" r="10" fill="#69b342"/><text x="22" y="270" text-anchor="middle" class="n">3</text>
    <text x="42" y="270" class="st">The UAG validates every answer</text>
    <text x="42" y="292" class="mono code">collect_field_data · agent/chat</text>
    <path d="M152 308 V320" class="flow" marker-end="url(#a)"/>

    <rect y="324" width="304" height="62" rx="10" class="card"/>
    <circle cx="22" cy="346" r="10" fill="#69b342"/><text x="22" y="350" text-anchor="middle" class="n">4</text>
    <text x="42" y="350" class="st">The person confirms; the UAG saves</text>
    <text x="42" y="372" class="mono code">submit_completed_form · submission</text>

    <rect y="402" width="304" height="96" rx="10" fill="#f5f7fa" stroke="#e0e5ec"/>
    <text x="16" y="426" class="k">MODEL RUNS</text><text x="104" y="426" class="v">the MCP client, or a UAG engine</text>
    <text x="16" y="452" class="k">LICENSE</text><text x="104" y="452" class="v">none on Open Source</text>
    <text x="16" y="478" class="k">LIVE DEMO</text><text x="104" y="478" class="v mono" style="font-size:11.5px">/examples/conversation</text>
  </g>

  <!-- Column 2: Agentic workflows -->
  <g transform="translate(348 20)">
    <rect width="304" height="66" rx="12" fill="#3a4756"/>
    <text x="16" y="28" class="h">Agentic workflows</text>
    <text x="16" y="50" class="sub">A submission starts a task. No person.</text>

    <rect y="84" width="304" height="62" rx="10" class="card"/>
    <circle cx="22" cy="106" r="10" fill="#69b342"/><text x="22" y="110" text-anchor="middle" class="n">1</text>
    <text x="42" y="110" class="st">An applicant submits to the UAG</text>
    <text x="42" y="132" class="s">It forwards the save to Form.io.</text>
    <path d="M152 148 V160" class="flow" marker-end="url(#a)"/>

    <rect y="164" width="304" height="62" rx="10" class="card"/>
    <circle cx="22" cy="186" r="10" fill="#69b342"/><text x="22" y="190" text-anchor="middle" class="n">2</text>
    <text x="42" y="190" class="st">Agent: Run task, after the save</text>
    <text x="42" y="212" class="s">In the background; nobody waits.</text>
    <path d="M152 228 V240" class="flow" marker-end="url(#a)"/>

    <rect y="244" width="304" height="62" rx="10" class="card"/>
    <circle cx="22" cy="266" r="10" fill="#69b342"/><text x="22" y="270" text-anchor="middle" class="n">3</text>
    <text x="42" y="270" class="st">Engines answer the task's fields</text>
    <text x="42" y="292" class="s">Decisions, scores, a written rationale.</text>
    <path d="M152 308 V320" class="flow" marker-end="url(#a)"/>

    <rect y="324" width="304" height="62" rx="10" class="card"/>
    <circle cx="22" cy="346" r="10" fill="#69b342"/><text x="22" y="350" text-anchor="middle" class="n">4</text>
    <text x="42" y="350" class="st">The UAG saves them as an update</text>
    <text x="42" y="372" class="s">Its update actions can run the next task.</text>

    <rect y="402" width="304" height="96" rx="10" fill="#f5f7fa" stroke="#e0e5ec"/>
    <text x="16" y="426" class="k">MODEL RUNS</text><text x="104" y="426" class="v">in the UAG's engines</text>
    <text x="16" y="452" class="k">LICENSE</text><text x="104" y="452" class="v">UAG license or hosted project</text>
    <text x="16" y="478" class="k">LIVE DEMO</text><text x="104" y="478" class="v mono" style="font-size:11.5px">/examples/workflow</text>
  </g>

  <!-- Column 3: Agentic Formflow -->
  <g transform="translate(676 20)">
    <rect width="304" height="66" rx="12" fill="#3a4756"/>
    <text x="16" y="28" class="h">Agentic Formflow</text>
    <text x="16" y="50" class="sub">A form fills itself in from what a person writes.</text>

    <rect y="84" width="304" height="62" rx="10" class="card"/>
    <circle cx="22" cy="106" r="10" fill="#69b342"/><text x="22" y="110" text-anchor="middle" class="n">1</text>
    <text x="42" y="110" class="st">A person describes what happened</text>
    <text x="42" y="132" class="s">In one text field of a wizard.</text>
    <path d="M152 148 V160" class="flow" marker-end="url(#a)"/>

    <rect y="164" width="304" height="62" rx="10" class="card"/>
    <circle cx="22" cy="186" r="10" fill="#69b342"/><text x="22" y="190" text-anchor="middle" class="n">2</text>
    <text x="42" y="190" class="st">@formio/uag-js asks the UAG</text>
    <text x="42" y="212" class="mono code">POST {form}/agent/extract, streamed</text>
    <path d="M152 228 V240" class="flow" marker-end="url(#a)"/>

    <rect y="244" width="304" height="62" rx="10" class="card"/>
    <circle cx="22" cy="266" r="10" fill="#69b342"/><text x="22" y="270" text-anchor="middle" class="n">3</text>
    <text x="42" y="270" class="st">Fast decisions usually arrive first</text>
    <text x="42" y="292" class="s">The wizard's conditional pages appear.</text>
    <path d="M152 308 V320" class="flow" marker-end="url(#a)"/>

    <rect y="324" width="304" height="62" rx="10" class="card"/>
    <circle cx="22" cy="346" r="10" fill="#69b342"/><text x="22" y="350" text-anchor="middle" class="n">4</text>
    <text x="42" y="350" class="st">Values follow as suggestions</text>
    <text x="42" y="372" class="s">Nothing is saved until the person submits.</text>

    <rect y="402" width="304" height="96" rx="10" fill="#f5f7fa" stroke="#e0e5ec"/>
    <text x="16" y="426" class="k">MODEL RUNS</text><text x="104" y="426" class="v">in the UAG's engines</text>
    <text x="16" y="452" class="k">LICENSE</text><text x="104" y="452" class="v">UAG license or hosted project</text>
    <text x="16" y="478" class="k">LIVE DEMO</text><text x="104" y="478" class="v mono" style="font-size:11.5px">/examples/formflow</text>
  </g>
</svg>
