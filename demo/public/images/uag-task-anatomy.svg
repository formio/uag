<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" role="img" aria-labelledby="t d">
  <title id="t">Anatomy of a task</title>
  <desc id="d">The demo's First Notice of Loss form, tagged uag, defines a task named triage with custom properties. The text area "Tell us what happened" is the task's input (uagField: input). Inside the Triage container (uag: triage), a content component holds the criteria (uagField: criteria), and Claim type, a radio, and Fraud signals present, a checkbox, are decision fields, answered by a decision engine with a calibrated confidence. Date of loss and Where did it happen, each flagged uag: triage on its own, are value fields, written by an agent engine as suggestions. The UAG validates every value with the form, then returns it from the Agent API or, in an Agent: Run task action, saves it with the submission.</desc>
  <defs>
    <style>
      text { font-family: Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #0c141d; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .h { font-size: 15px; font-weight: 700; }
      .lbl { font-size: 12.5px; font-weight: 600; fill: #2a333e; }
      .s { font-size: 12px; fill: #566073; }
      .xs { font-size: 11px; fill: #566073; }
      .ph { font-size: 11.5px; fill: #8d99a8; font-style: italic; }
      .chip { font-size: 11px; fill: #2a333e; }
      .w { fill: #ffffff; }
      .input { fill: #ffffff; stroke: #c9d2dc; }
      .chipbg { fill: #f1f3f6; stroke: #dde2e9; }
      .card { fill: #ffffff; stroke: #d7dde5; stroke-width: 1.2; }
    </style>
  </defs>
  <rect x="1" y="1" width="998" height="538" rx="18" fill="#ffffff" stroke="#e0e5ec"/>

  <!-- The form -->
  <rect x="20" y="20" width="560" height="500" rx="12" fill="#fbfcfd" stroke="#d7dde5"/>
  <text x="38" y="48" class="h">First Notice of Loss</text>
  <rect x="456" y="32" width="108" height="24" rx="12" fill="#3a4756"/>
  <text x="510" y="48" text-anchor="middle" class="mono chip w">tags: ["uag"]</text>

  <!-- Input -->
  <rect x="32" y="74" width="4" height="78" rx="2" fill="#f19d59"/>
  <text x="48" y="88" class="lbl">Tell us what happened</text>
  <rect x="48" y="96" width="290" height="52" rx="6" class="input"/>
  <text x="58" y="116" class="ph">I rear-ended a car at the light on Main St</text>
  <text x="58" y="134" class="ph">yesterday around 5pm. My bumper is cracked…</text>
  <rect x="356" y="98" width="110" height="22" rx="6" class="chipbg"/><text x="364" y="113" class="mono chip">uag: triage</text>
  <rect x="356" y="126" width="124" height="22" rx="6" class="chipbg"/><text x="364" y="141" class="mono chip">uagField: input</text>

  <!-- Container -->
  <rect x="40" y="166" width="528" height="218" rx="10" fill="none" stroke="#8d99a8" stroke-dasharray="5 4"/>
  <text x="54" y="186" class="lbl">Triage</text>
  <text x="104" y="186" class="xs">container: every field inside joins the task</text>
  <rect x="432" y="173" width="110" height="22" rx="6" class="chipbg"/><text x="440" y="188" class="mono chip">uag: triage</text>

  <!-- Criteria -->
  <rect x="48" y="202" width="4" height="62" rx="2" fill="#3a4756"/>
  <rect x="60" y="202" width="282" height="62" rx="6" fill="#f5f7fa" stroke="#e0e5ec"/>
  <text x="70" y="221" class="xs">Classify a first notice of loss for an auto or</text>
  <text x="70" y="237" class="xs">home policy from the policyholder's description.</text>
  <text x="70" y="253" class="xs">Claim type: collision means a vehicle struck…</text>
  <rect x="356" y="206" width="142" height="22" rx="6" class="chipbg"/><text x="364" y="221" class="mono chip">uagField: criteria</text>
  <rect x="356" y="234" width="186" height="22" rx="6" class="chipbg"/><text x="364" y="249" class="mono chip">uagContext: policyNumber</text>

  <!-- Decision: radio -->
  <rect x="48" y="278" width="4" height="58" rx="2" fill="#69b342"/>
  <text x="60" y="292" class="lbl">Claim type</text>
  <circle cx="66" cy="309" r="5.5" fill="none" stroke="#8d99a8"/><text x="76" y="313" class="xs">Auto: collision</text>
  <circle cx="180" cy="309" r="5.5" fill="none" stroke="#8d99a8"/><text x="190" y="313" class="xs">Auto: glass only</text>
  <circle cx="66" cy="327" r="5.5" fill="none" stroke="#8d99a8"/><text x="76" y="331" class="xs">Theft</text>
  <circle cx="180" cy="327" r="5.5" fill="none" stroke="#8d99a8"/><text x="190" y="331" class="xs">Property damage</text>
  <rect x="356" y="290" width="134" height="22" rx="6" class="chipbg"/><text x="364" y="305" class="mono chip">uagThreshold: 0.6</text>

  <!-- Decision: checkbox -->
  <rect x="48" y="346" width="4" height="26" rx="2" fill="#69b342"/>
  <rect x="60" y="352" width="13" height="13" rx="3" fill="none" stroke="#8d99a8"/>
  <text x="82" y="363" class="lbl">Fraud signals present</text>
  <rect x="356" y="348" width="172" height="22" rx="6" class="chipbg"/><text x="364" y="363" class="mono chip">uagAuthoritative: true</text>

  <!-- Value fields, outside the container, each flagged on its own -->
  <rect x="32" y="396" width="4" height="48" rx="2" fill="#0079c0"/>
  <text x="48" y="410" class="lbl">Date of loss</text>
  <rect x="48" y="418" width="180" height="26" rx="6" class="input"/>
  <text x="58" y="435" class="ph">yyyy-mm-dd</text>
  <rect x="356" y="420" width="110" height="22" rx="6" class="chipbg"/><text x="364" y="435" class="mono chip">uag: triage</text>

  <rect x="32" y="456" width="4" height="52" rx="2" fill="#0079c0"/>
  <text x="48" y="470" class="lbl">Where did it happen?</text>
  <rect x="48" y="478" width="290" height="28" rx="6" class="input"/>
  <rect x="356" y="481" width="110" height="22" rx="6" class="chipbg"/><text x="364" y="496" class="mono chip">uag: triage</text>

  <!-- Roles -->
  <rect x="604" y="20" width="376" height="64" rx="10" class="card"/>
  <rect x="604" y="20" width="6" height="64" rx="3" fill="#f19d59"/>
  <text x="624" y="45" class="lbl">Input <tspan class="mono xs">uagField: input</tspan></text>
  <text x="624" y="66" class="s">What the task reads. Without one, the submission.</text>

  <rect x="604" y="96" width="376" height="64" rx="10" class="card"/>
  <rect x="604" y="96" width="6" height="64" rx="3" fill="#3a4756"/>
  <text x="624" y="121" class="lbl">Criteria <tspan class="mono xs">uagField: criteria</tspan></text>
  <text x="624" y="142" class="s">The instructions, in plain language, in the form.</text>

  <rect x="604" y="172" width="376" height="104" rx="10" class="card"/>
  <rect x="604" y="172" width="6" height="104" rx="3" fill="#69b342"/>
  <text x="624" y="197" class="lbl">Decision fields <tspan class="s">→ decision engine</tspan></text>
  <text x="624" y="218" class="s">Radio, select, checkbox, select boxes, survey.</text>
  <text x="624" y="236" class="s">Picks an option, with a calibrated confidence.</text>
  <rect x="624" y="246" width="340" height="22" rx="6" fill="#edfae6"/>
  <text x="634" y="261" class="mono chip" style="fill:#3f7a22">triage.claimType: "autoCollision"  0.94 confident</text>

  <rect x="604" y="288" width="376" height="104" rx="10" class="card"/>
  <rect x="604" y="288" width="6" height="104" rx="3" fill="#0079c0"/>
  <text x="624" y="313" class="lbl">Value fields <tspan class="s">→ agent engine</tspan></text>
  <text x="624" y="334" class="s">Dates, amounts, names, free text.</text>
  <text x="624" y="352" class="s">Written as a suggestion, never as confident.</text>
  <rect x="624" y="362" width="340" height="22" rx="6" fill="#e6f3fb"/>
  <text x="634" y="377" class="mono chip" style="fill:#005f96">lossDate: "2026-10-26"  suggested</text>

  <rect x="604" y="404" width="376" height="116" rx="10" fill="#3a4756"/>
  <text x="624" y="430" class="lbl w">The UAG checks every answer</text>
  <text x="624" y="452" class="s" style="fill:#c9d2dc">It validates each value with the form's own rules,</text>
  <text x="624" y="470" class="s" style="fill:#c9d2dc">then returns it (extract, decide, generate) or</text>
  <text x="624" y="488" class="s" style="fill:#c9d2dc">saves it with the submission (Agent: Run task).</text>
  <text x="624" y="508" class="xs" style="fill:#8d99a8">Engines never write. Override one per field or task: uagEngine.</text>
</svg>
