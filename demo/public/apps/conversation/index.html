<!doctype html>
<html lang="en" data-uag-url="{{uag.url}}" data-uag-project-url="{{uag.projectUrl}}" data-project-url="{{projectUrl}}" data-formio-base-url="{{formioBaseUrl}}" data-production="{{production}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Service request chat | UAG demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@formio/js@{{formioJsVersion}}/dist/formio.full.min.css">
<link rel="stylesheet" href="{{uag.url}}/uag-js/uag-js.css">
<link rel="stylesheet" href="chat.css?v={{assetVersion}}">
<script src="https://cdn.jsdelivr.net/npm/marked@15.0.7/marked.min.js"
        integrity="sha384-H+hy9ULve6xfxRkWIh/YOtvDdpXgV2fmAGQkIDTxIgZwNoaoBal14Di2YTMR6MzR"
        crossorigin="anonymous" defer></script>
<script src="/js/flow-log.js?v={{assetVersion}}" defer></script>
<script src="/js/guest.js?v={{assetVersion}}" defer></script>
<script src="https://cdn.jsdelivr.net/npm/@formio/js@{{formioJsVersion}}/dist/formio.full.min.js" defer></script>
<!-- @formio/uag-js, from the UAG: it registers itself, with the UAG's modules. -->
<script src="{{uag.url}}/uag-js/uag.use.js" defer></script>
<script src="/js/demo-app.js?v={{assetVersion}}" defer></script>
<script src="chat.js?v={{assetVersion}}" defer></script>
</head>
<body>
<main>
  <header>
    <div class="brand">
      <span class="logo" aria-hidden="true">◎</span>
      <div>
        <h1>Brightline Support</h1>
        <p>Report an outage or request service. A fictional company, for this demo.</p>
      </div>
    </div>
  </header>

  <div id="chat" class="chat-host"></div>

  <section id="receipt" class="receipt" aria-live="polite" hidden></section>
</main>
</body>
</html>
