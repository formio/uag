# The UAG behind the demo site (ai.form.io), for deployment: the UAG and its AI
# Document add-on, from released images, on the demo's project on Form.io's
# hosted service (https://uag.form.io). Every setting is written here; nothing is
# read from the environment or an .env file. The site itself is static files on
# S3 + CloudFront (site.yml, published by .github/workflows/site.yml).
#
#   formio-uag  the Universal Agent Gateway, with the JEV and Claude engines
#               inside it. The only service with a published port: plain HTTP
#               on 3200. Your load balancer ends TLS for its host name
#               (uag.ai.form.io) and forwards every path to it. Browsers call
#               it from the site, as guests of the project.
#   uag-documents
#               the AI Document add-on: at each "up" it copies the AI Document
#               module and the document plugins into the uag-documents volume,
#               which the UAG mounts at /app/plugins/documents, and exits. The
#               UAG starts after it, and restarts when a newer add-on runs.
#               Without it, the AI Document demo (/examples/documents)
#               answers that its process is not installed.
#
# Run it from this folder of a checkout of the repository: it mounts
# ../uag-module, the demo's rate limits. Before running it, replace each
# CHANGE_ME (a "$" in a value is written "$$").
#
#   docker compose pull && docker compose up -d
#
# The UAG image follows the newest release (latest); to pin a release, set
# its tag (2.0.0, say). The add-on follows @formio/uag-extras: :1 is the
# newest 1.x (pin 1.0.0, say). The UAG's health check is GET /health.
name: uag-demo

services:
  # Runs once at each "up" and exits; no restart policy.
  uag-documents:
    image: formio/uag-documents:1
    volumes:
      - uag-documents:/out

  formio-uag:
    image: formio/uag
    restart: always
    depends_on:
      uag-documents:
        condition: service_completed_successfully
        restart: true
    ports:
      # Only the load balancer may reach this port.
      - "3200:3200"
    volumes:
      - uag-documents:/app/plugins/documents:ro
      # The demo's rate limits.
      - ../uag-module:/app/module:ro
    environment:
      PORT: "3200"
      PROJECT: https://uag.form.io
      # An API key of the project (its Settings, API Keys).
      PROJECT_KEY: CHANGE_ME
      # Signs the UAG's tokens. openssl rand -hex 32
      JWT_SECRET: CHANGE_ME
      JWT_EXPIRE_TIME: "60"
      PROJECT_TTL: "300"
      PROJECT_RETRIES: "30"
      # The site's origin: the only one browsers may call the UAG from.
      CORS: https://ai.form.io
      # Proxy hops in front of the UAG that add to X-Forwarded-For.
      TRUST_PROXY: "1"
      UAG_ENGINES: jev,claude
      TYPESAFE_API_KEY: CHANGE_ME
      CLAUDE_API_KEY: CHANGE_ME
      CLAUDE_MODEL: claude-sonnet-5-5

volumes:
  uag-documents:
