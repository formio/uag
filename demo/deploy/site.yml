AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  The Form.io UAG demo site (ai.form.io): the static build of demo/ in a private
  S3 bucket, served by CloudFront. The site's examples call the UAG from the
  browser; nothing else runs here.

# Deploy in us-east-1 (CloudFront's certificate must be there):
#
#   aws cloudformation deploy --region us-east-1 --stack-name uag-demo-site \
#     --template-file demo/deploy/site.yml --capabilities CAPABILITY_NAMED_IAM \
#     --parameter-overrides DomainName=ai.form.io CertificateArn=arn:aws:acm:us-east-1:... \
#       UagOrigin=https://uag.ai.form.io
#
# Then point the domain at the DistributionDomainName output (a CNAME, or an
# alias record), and give .github/workflows/site.yml the outputs (see
# demo/README.md, "Hosting").

Parameters:
  DomainName:
    Type: String
    Default: ai.form.io
    Description: The site's domain.
  CertificateArn:
    Type: String
    Description: An ACM certificate in us-east-1 for DomainName.
  UagOrigin:
    Type: String
    Default: https://uag.ai.form.io
    AllowedPattern: "^https://[a-z0-9.-]+(:[0-9]+)?$"
    Description: >-
      The UAG the site embeds (its DEMO_UAG_URL, scheme and host only). The
      Content-Security-Policy allows scripts, styles and calls from it.
  GitHubRepository:
    Type: String
    Default: formio/uag
    Description: The repository whose site workflow may deploy (owner/name).
  GitHubEnvironment:
    Type: String
    Default: demo-site
    Description: The GitHub environment the site workflow's deploy job runs in.
  GitHubOidcProviderArn:
    Type: String
    Default: ""
    Description: >-
      The account's IAM OIDC provider for token.actions.githubusercontent.com,
      when it has one. Empty creates it (an account can have only one).

Conditions:
  CreateOidcProvider: !Equals [!Ref GitHubOidcProviderArn, ""]

Resources:
  Bucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-site"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # Only this distribution reads the bucket.
  BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref Bucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: CloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${Bucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

  # Clean URLs, as scripts/serve.mjs answers them locally: /a/b and /a/b/ are a/b/index.html.
  CleanUrls:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "${AWS::StackName}-clean-urls"
      AutoPublish: true
      FunctionConfig:
        Comment: Serve <path>/index.html for <path> and <path>/
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var uri = request.uri;
          if (uri.endsWith('/')) {
            request.uri = uri + 'index.html';
          } else if (uri.split('/').pop().indexOf('.') === -1) {
            request.uri = uri + '/index.html';
          }
          return request;
        }

  # The deploy sets each file's Cache-Control (HTML revalidated, versioned assets
  # kept); the query string is part of the key, so ?v= fetches a new release's.
  CachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub "${AWS::StackName}-site"
        MinTTL: 0
        DefaultTTL: 86400
        MaxTTL: 31536000
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: true
          EnableAcceptEncodingBrotli: true
          CookiesConfig:
            CookieBehavior: none
          HeadersConfig:
            HeaderBehavior: none
          QueryStringsConfig:
            QueryStringBehavior: all

  # Keep the Content-Security-Policy the same as lib/config.mjs's contentSecurityPolicy (demo/test checks).
  HeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub "${AWS::StackName}-site"
        SecurityHeadersConfig:
          ContentSecurityPolicy:
            Override: true
            ContentSecurityPolicy: !Sub "default-src 'self'; script-src 'self' 'unsafe-eval' https://cdn.jsdelivr.net https://cdn.form.io ${UagOrigin}; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net https://cdn.form.io ${UagOrigin}; font-src 'self' data: https://fonts.gstatic.com https://cdn.jsdelivr.net https://cdn.form.io ${UagOrigin}; img-src 'self' data: blob: https:; connect-src 'self' ${UagOrigin} https://*.form.io; frame-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'"
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: SAMEORIGIN
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: false
            Override: true
        CustomHeadersConfig:
          Items:
            - Header: Permissions-Policy
              Value: camera=(), microphone=(), geolocation=()
              Override: true

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: !Sub "${DomainName} (UAG demo site)"
        Enabled: true
        Aliases: [!Ref DomainName]
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        DefaultRootObject: index.html
        ViewerCertificate:
          AcmCertificateArn: !Ref CertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          - Id: site
            DomainName: !GetAtt Bucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: !Ref CachePolicy
          ResponseHeadersPolicyId: !Ref HeadersPolicy
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt CleanUrls.FunctionMetadata.FunctionARN
        # S3 answers 403 for a missing object (CloudFront may not list the bucket).
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 60
          - ErrorCode: 404
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 60

  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]

  # Assumed by .github/workflows/site.yml through GitHub's OIDC, so no AWS key is stored anywhere.
  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Publishes the UAG demo site from GitHub Actions.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If [CreateOidcProvider, !Ref GitHubOidcProvider, !Ref GitHubOidcProviderArn]
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub "repo:${GitHubRepository}:environment:${GitHubEnvironment}"
      Policies:
        - PolicyName: publish-site
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt Bucket.Arn
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject]
                Resource: !Sub "${Bucket.Arn}/*"
              - Effect: Allow
                Action: cloudfront:CreateInvalidation
                Resource: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

Outputs:
  BucketName:
    Description: The bucket the site workflow publishes to (DEMO_SITE_BUCKET).
    Value: !Ref Bucket
  DistributionId:
    Description: The distribution the site workflow invalidates (DEMO_SITE_DISTRIBUTION_ID).
    Value: !Ref Distribution
  DistributionDomainName:
    Description: Point DomainName here.
    Value: !GetAtt Distribution.DomainName
  DeployRoleArn:
    Description: The role the site workflow assumes (DEMO_SITE_ROLE_ARN).
    Value: !GetAtt DeployRole.Arn
