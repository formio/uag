name: Publish UAG

on:
  push:
    tags: ["v*"] # Triggers on version tags like v1.0.0

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      # Required for npm Trusted Publishing (OIDC). Without it npm auth fails
      # with a misleading 404 on PUT rather than a 401.
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # Image tags are unprefixed (1.12.3), while the git tag carries a leading v,
      # so github.ref_name cannot be used directly.
      - name: Resolve the release version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      ### Publish underlying npm package:

      # package.json pins "packageManager": "yarn@4", and the runner's global
      # yarn 1.x refuses to run anything without Corepack enabled. This must come
      # BEFORE setup-node: setup-node probes `yarn cache dir` while configuring
      # its cache, which hits the same error and fails the whole step.
      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "lts/*"
          registry-url: "https://registry.npmjs.org"
          # setup-node v5 enables package-manager caching by default, which is
          # what runs the `yarn cache dir` probe. Corepack shims are installed
          # against the pre-setup Node, so the probe can still fail here; the
          # yarn install below is unaffected and fast enough without the cache.
          package-manager-cache: false

      # Trusted Publishing needs npm >= 11.5.1; the LTS Node images still bundle
      # npm 10.x.
      - name: Upgrade npm for Trusted Publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run tests
        run: yarn test --if-present

      - name: Build package
        run: yarn build --if-present

      # No NODE_AUTH_TOKEN: OIDC supplies short-lived credentials, and leaving a
      # token in the environment makes npm prefer it and skip Trusted Publishing.
      - name: Publish package to npm
        run: npm publish

      - name: Docker Login
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # arm64 as well as amd64: a large share of developers run Apple Silicon,
      # where an amd64-only image is emulated and warns on every run. Buildx
      # replaces the previous build/tag/push trio — it builds both platforms and
      # pushes a single multi-arch manifest, which the plain docker driver cannot
      # do at all.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push formio/uag
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          tags: |
            formio/uag:latest
            formio/uag:${{ steps.version.outputs.version }}

      ### Publish the Claude integration (@formio/uag-claude + formio/uag-claude).
      # Versioned independently of the core package on purpose: the module shares
      # no code with UAG (it talks MCP/HTTP, imports no @formio/* package) and
      # frequently does not change when core does — it sat at 1.2.0 from
      # 2026-02-20 to 2026-04-17 across two core releases. Syncing the numbers
      # would force rebuilds of an unchanged artifact and destroy the only signal
      # the version carries. Instead every core tag checks whether the module's
      # own version is already published and skips it when unchanged, so a
      # release can never be silently forgotten. Compatibility between the two is
      # documented in the README matrix, not implied by matching versions.
      - name: Check whether the Claude integration needs publishing
        id: claude
        working-directory: integrations/claude
        run: |
          set -euo pipefail
          VERSION=$(jq -r .version package.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          if npm view "@formio/uag-claude@${VERSION}" version >/dev/null 2>&1; then
            echo "npm already has @formio/uag-claude@${VERSION} — skipping npm."
          else
            echo "npm=publish" >> "$GITHUB_OUTPUT"
          fi

          CODE=$(curl -s -o /dev/null -w '%{http_code}' \
            "https://hub.docker.com/v2/repositories/formio/uag-claude/tags/${VERSION}")
          if [ "$CODE" = "200" ]; then
            echo "Docker Hub already has formio/uag-claude:${VERSION} — skipping image."
          else
            echo "docker=publish" >> "$GITHUB_OUTPUT"
          fi

      # First publish of a brand-new package name may not be possible over OIDC;
      # if this fails on the very first run, publish once locally and let CI take
      # over from then on.
      - name: Publish Claude integration to npm
        if: steps.claude.outputs.npm == 'publish'
        working-directory: integrations/claude
        run: npm publish --access public

      # Also via buildx, for two reasons: it gains arm64 like the core image, and
      # a plain `docker build` would no longer work here anyway — with buildx set
      # up as the default builder the result lands in the build cache rather than
      # the local image store, so the follow-up tag and push would not find it.
      - name: Build and push Claude integration image
        if: steps.claude.outputs.docker == 'publish'
        uses: docker/build-push-action@v6
        with:
          context: integrations/claude
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          tags: |
            formio/uag-claude:latest
            formio/uag-claude:${{ steps.claude.outputs.version }}

      ### Publish MCP server:
      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login dns --domain form.io --private-key ${{ secrets.MCP_PRIVATE_KEY }}

      - name: Set version in server.json
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          jq --arg v "$VERSION" '.version = $v | .packages[0].version = $v' server.json > server.tmp && mv server.tmp server.json

      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish