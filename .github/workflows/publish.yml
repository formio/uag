name: Publish UAG

on:
  push:
    # branches: ["kburge-main"]
    tags: ["v[0-9]*"]

  workflow_dispatch:
    inputs:
      dry_run:
        description: Publish and deploy as dry runs where supported, skip the rest
        type: boolean
        default: false

permissions:
  contents: read

env:
  DRY_RUN: ${{ inputs.dry_run }}

jobs:
  # getting-started:
  #   runs-on: ubuntu-latest
  #   environment: production
  #   permissions:
  #     contents: read
  #   steps:
  #     - name: Checkout code
  #       uses: actions/checkout@v7

  #     - name: Enable Corepack
  #       run: corepack enable

  #     - name: Install dependencies
  #       run: yarn install --immutable

  #     - name: Run the Getting Started guides
  #       run: yarn test:getting-started
  #       env:
  #         E2E_STRICT: "true"
  #         # A project on Form.io's hosted service with the demo's claim form, and an API key of it.
  #         E2E_HOSTED_PROJECT_URL: ${{ vars.E2E_HOSTED_PROJECT_URL }}
  #         E2E_HOSTED_PROJECT_KEY: ${{ secrets.E2E_HOSTED_PROJECT_KEY }}
  #         # A Form.io license that includes the UAG and allows formio.e2e.test.
  #         E2E_FORMIO_LICENSE: ${{ secrets.E2E_FORMIO_LICENSE }}
  #         E2E_FORMIO_LICENSE_REMOTE: ${{ vars.E2E_FORMIO_LICENSE_REMOTE }}
  #         CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
  #         TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}

  # One checkout and one install: works out the release, builds and tests, then
  # publishes to npm and the MCP registry.
  build:
    # needs: getting-started ########################################## restore
    runs-on: aws-build-runner
    environment: production
    outputs:
      kind: ${{ steps.release.outputs.kind }}
      version: ${{ steps.release.outputs.version }}
      channel: ${{ steps.release.outputs.channel }}
      targets: ${{ steps.release.outputs.targets }}
    env:
      PRIVATE_NPM_REGISTRY: ${{ vars.PRIVATE_NPM_REGISTRY }}
    steps:
      - uses: actions/checkout@v7

      - id: release
        run: .github/run.sh release

      - run: corepack enable && yarn install --immutable
      - run: yarn workspaces foreach --all --topological run build
      - run: yarn workspaces foreach --all --topological run test
        env:
          LICENSE_KEY: ""

      - if: steps.release.outputs.kind != 'branch'
        run: node scripts/check-release.mjs --before-publish

      - name: Publish to npm
        if: steps.release.outputs.kind != 'branch'
        env:
          PRIVATE_NPM_TOKEN: ${{ secrets.PRIVATE_NPM_TOKEN }}
        run: .github/run.sh publish_packages "${{ steps.release.outputs.kind }}" "${{ steps.release.outputs.channel }}"

      - name: Wait for npm
        if: steps.release.outputs.kind == 'release' && env.DRY_RUN != 'true'
        run: .github/run.sh wait_for_packages

      - name: Publish to the MCP registry
        if: steps.release.outputs.kind == 'release' && env.DRY_RUN != 'true'
        env:
          MCP_PRIVATE_KEY: ${{ secrets.MCP_PRIVATE_KEY }}
        run: .github/run.sh publish_mcp "${{ steps.release.outputs.version }}"

  # Builds from the local checkout (path context), so BuildKit does not clone
  # the repository; .dockerignore keeps the context sent to the remote builders small.
  images:
    needs: [build]
    runs-on: aws-build-runner
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.CI_ROLE_ARN }}
          aws-region: us-east-1

      - uses: aws-actions/amazon-ecr-login@v2

      - name: Set up the remote builders
        uses: docker/setup-buildx-action@v4
        with:
          driver: remote
          endpoint: ${{ vars.BUILDER_AMD64_ENDPOINT }}
          platforms: linux/amd64
          append: |-
            - endpoint: ${{ vars.BUILDER_ARM64_ENDPOINT }}
              platforms: linux/arm64
        env:
          BUILDER_NODE_0_AUTH_TLS_CACERT: ${{ secrets.BUILDER_CA }}
          BUILDER_NODE_0_AUTH_TLS_CERT: ${{ secrets.BUILDER_CERT }}
          BUILDER_NODE_0_AUTH_TLS_KEY: ${{ secrets.BUILDER_KEY }}
          BUILDER_NODE_1_AUTH_TLS_CACERT: ${{ secrets.BUILDER_CA }}
          BUILDER_NODE_1_AUTH_TLS_CERT: ${{ secrets.BUILDER_CERT }}
          BUILDER_NODE_1_AUTH_TLS_KEY: ${{ secrets.BUILDER_KEY }}

      - name: Bake and push
        uses: docker/bake-action@v7
        with:
          # Local path context instead of the default Git context.
          source: .
          push: true
          vars: |
            VERSION=${{ needs.build.outputs.version }}
            CHANNEL=${{ needs.build.outputs.channel }}
            REGISTRIES=${{ vars.PRIVATE_ECR_REGISTRY }}/

  # Copies the ECR manifests, so Docker Hub gets the tested images. The demo
  # images are not published here.
  dockerhub:
    needs: [build, images]
    if: ${{ needs.build.outputs.kind == 'release' && !inputs.dry_run }}
    runs-on: aws-build-runner
    permissions:
      contents: read
      id-token: write
    steps:
      # Only run.sh, not the whole repository.
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/run.sh
          sparse-checkout-cone-mode: false

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.CI_ROLE_ARN }}
          aws-region: us-east-1

      - uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - run: .github/run.sh copy_to_dockerhub "${{ vars.PRIVATE_ECR_REGISTRY }}" "${{ needs.build.outputs.version }}" "${{ needs.build.outputs.channel }}"

  deploy:
    needs: [build, images]
    if: ${{ needs.build.outputs.kind != 'branch' }}
    runs-on: aws-build-runner
    permissions:
      contents: read
      id-token: write
    # A release goes to test, then production; a failure stops the rest.
    strategy:
      max-parallel: 1
      matrix:
        target: ${{ fromJSON(needs.build.outputs.targets) }}
    steps:
      # Only run.sh, not the whole repository.
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/run.sh
          sparse-checkout-cone-mode: false

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.CI_ROLE_ARN }}
          aws-region: ${{ matrix.target.region }}

      - name: Deploy
        run: .github/run.sh deploy "${{ vars.PRIVATE_ECR_REGISTRY }}/formio" "${{ needs.build.outputs.version }}" "${{ matrix.target.prefix }}" "${{ matrix.target.region }}"
