name: Publish UAG

# A pushed version tag (v2.0.0, v2.0.0-rc.1) publishes, from whatever branch it
# is on: tag a branch to publish a release candidate before its pull request is
# merged. A run by hand (Actions, Publish UAG, Run workflow; or `gh workflow
# run publish.yml --ref <ref>`) on a branch builds and tests it and pushes its
# images to ECR only; on a tag it publishes that release, as a push of the tag
# would. See RELEASING.md.
on:
  push:
    tags: ["v[0-9]*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The Getting Started page is where most people first run the UAG. Run its
  # three guides as documented (test/e2e/layer3.getting-started.e2e.mjs) before
  # anything is published. E2E_STRICT fails a guide whose keys or license are
  # missing instead of skipping it.
  getting-started:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7

      # Before setup-node, which probes yarn: package.json pins yarn 4.
      - name: Enable Corepack
        run: corepack enable

      # Node 24, as the images use: Node 25 and later ship without corepack.
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run the Getting Started guides
        run: yarn test:getting-started
        env:
          E2E_STRICT: "true"
          # A project on Form.io's hosted service with the demo's claim form, and an API key of it.
          E2E_HOSTED_PROJECT_URL: ${{ vars.E2E_HOSTED_PROJECT_URL }}
          E2E_HOSTED_PROJECT_KEY: ${{ secrets.E2E_HOSTED_PROJECT_KEY }}
          # A Form.io license that includes the UAG and allows formio.e2e.test.
          E2E_FORMIO_LICENSE: ${{ secrets.E2E_FORMIO_LICENSE }}
          E2E_FORMIO_LICENSE_REMOTE: ${{ vars.E2E_FORMIO_LICENSE_REMOTE }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}

  # Build and test every package, and publish a prerelease to the private npm
  # registry.
  build:
    needs: getting-started
    runs-on: aws-build-runner
    environment: production
    outputs:
      kind: ${{ steps.release.outputs.kind }}
      version: ${{ steps.release.outputs.version }}
      channel: ${{ steps.release.outputs.channel }}
      targets: ${{ steps.release.outputs.targets }}
    steps:
      - uses: actions/checkout@v7

      - id: release
        run: .github/run.sh release

      - run: corepack enable && yarn install --immutable
      - run: yarn workspaces foreach --all --topological run build
      - run: yarn workspaces foreach --all --topological run test
        env:
          LICENSE_KEY: ""

      # Before publishing anything. It skips the check that @formio/uag's
      # dependencies are on npm; @formio/uag's prepublishOnly runs it.
      - if: steps.release.outputs.kind != 'branch'
        run: node scripts/check-release.mjs --before-publish

      - name: Publish the prerelease to the private npm registry
        if: steps.release.outputs.kind == 'pre'
        env:
          PRIVATE_NPM_REGISTRY: ${{ vars.PRIVATE_NPM_REGISTRY }}
          PRIVATE_NPM_TOKEN: ${{ secrets.PRIVATE_NPM_TOKEN }}
        run: .github/run.sh publish_prerelease "${{ steps.release.outputs.channel }}"

  # A release goes to npmjs through Trusted Publishing (OIDC), which npm accepts
  # only from GitHub-hosted runners. No NODE_AUTH_TOKEN: a token in the
  # environment makes npm skip Trusted Publishing.
  npm:
    needs: build
    if: needs.build.outputs.kind == 'release'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Enable Corepack
        run: corepack enable

      # Node 24 bundles npm 11.5.1 or later, which Trusted Publishing needs.
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          package-manager-cache: false

      - run: yarn install --immutable
      - run: yarn workspaces foreach --all --topological run build

      - name: Publish to npm
        run: .github/run.sh publish_release

  # The registry lists one current version, so releases only; after npm, which
  # it checks for the package.
  mcp:
    needs: [build, npm]
    runs-on: aws-build-runner
    environment: production
    steps:
      - uses: actions/checkout@v7

      - name: Publish to the MCP registry
        env:
          MCP_PRIVATE_KEY: ${{ secrets.MCP_PRIVATE_KEY }}
        run: .github/run.sh publish_mcp "${{ needs.build.outputs.version }}"

  # Build both images for amd64 and arm64 on native remote builders, and push
  # them to ECR.
  images:
    needs: build
    runs-on: aws-build-runner
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.CI_ROLE_ARN }}
          aws-region: us-east-1

      - uses: aws-actions/amazon-ecr-login@v2

      - name: Set up the remote builders
        uses: docker/setup-buildx-action@v4
        with:
          driver: remote
          endpoint: ${{ vars.BUILDER_AMD64_ENDPOINT }}
          platforms: linux/amd64
          append: |-
            - endpoint: ${{ vars.BUILDER_ARM64_ENDPOINT }}
              platforms: linux/arm64
        env:
          BUILDER_NODE_0_AUTH_TLS_CACERT: ${{ secrets.BUILDER_CA }}
          BUILDER_NODE_0_AUTH_TLS_CERT: ${{ secrets.BUILDER_CERT }}
          BUILDER_NODE_0_AUTH_TLS_KEY: ${{ secrets.BUILDER_KEY }}
          BUILDER_NODE_1_AUTH_TLS_CACERT: ${{ secrets.BUILDER_CA }}
          BUILDER_NODE_1_AUTH_TLS_CERT: ${{ secrets.BUILDER_CERT }}
          BUILDER_NODE_1_AUTH_TLS_KEY: ${{ secrets.BUILDER_KEY }}

      - name: Bake and push
        uses: docker/bake-action@v7
        with:
          source: .
          push: true
          vars: |
            VERSION=${{ needs.build.outputs.version }}
            CHANNEL=${{ needs.build.outputs.channel }}
            REGISTRIES=${{ vars.PRIVATE_ECR_REGISTRY }}/

  # Releases only: prereleases and branches stay in ECR.
  dockerhub:
    needs: [build, images]
    if: needs.build.outputs.kind == 'release'
    runs-on: aws-build-runner
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/run.sh
          sparse-checkout-cone-mode: false

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.CI_ROLE_ARN }}
          aws-region: us-east-1

      - uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - run: .github/run.sh copy_to_dockerhub "${{ vars.PRIVATE_ECR_REGISTRY }}" "${{ needs.build.outputs.version }}" "${{ needs.build.outputs.channel }}"

  # A prerelease deploys to test; a release to test, then production.
  deploy:
    needs: [build, images]
    if: needs.build.outputs.kind != 'branch'
    runs-on: aws-build-runner
    environment: production
    permissions:
      contents: read
      id-token: write
    strategy:
      max-parallel: 1
      matrix:
        target: ${{ fromJSON(needs.build.outputs.targets) }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/run.sh
          sparse-checkout-cone-mode: false

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.CI_ROLE_ARN }}
          aws-region: ${{ matrix.target.region }}

      - name: Deploy
        run: .github/run.sh deploy "${{ vars.PRIVATE_ECR_REGISTRY }}/formio" "${{ needs.build.outputs.version }}" "${{ matrix.target.prefix }}" "${{ matrix.target.region }}" "${{ matrix.target.cluster }}"
