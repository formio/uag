name: Publish UAG

on:
  push:
    tags: ["v*"] # Triggers on version tags like v1.0.0

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      # Required for npm Trusted Publishing (OIDC). Without it npm auth fails
      # with a misleading 404 on PUT rather than a 401.
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      ### Publish underlying npm package:

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "lts/*"
          registry-url: "https://registry.npmjs.org"

      # package.json pins "packageManager": "yarn@4", which the runner's global
      # yarn 1.x refuses to run without Corepack enabled.
      - name: Enable Corepack
        run: corepack enable

      # Trusted Publishing needs npm >= 11.5.1; the LTS Node images still bundle
      # npm 10.x.
      - name: Upgrade npm for Trusted Publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run tests
        run: yarn test --if-present

      - name: Build package
        run: yarn build --if-present

      # No NODE_AUTH_TOKEN: OIDC supplies short-lived credentials, and leaving a
      # token in the environment makes npm prefer it and skip Trusted Publishing.
      - name: Publish package to npm
        run: npm publish

      - name: Docker Build
        run: |
          docker build -t formio/uag --platform=linux/amd64 .
          docker tag formio/uag:latest formio/uag:${GITHUB_REF#refs/tags/v}

      - name: Docker Login
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker Push
        run: |
          docker push formio/uag:latest
          docker push formio/uag:${GITHUB_REF#refs/tags/v}

      ### Publish MCP server:
      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login dns --domain form.io --private-key ${{ secrets.MCP_PRIVATE_KEY }}

      - name: Set version in server.json
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          jq --arg v "$VERSION" '.version = $v | .packages[0].version = $v' server.json > server.tmp && mv server.tmp server.json

      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish