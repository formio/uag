<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Service Request — Chat</title>
<style>
  :root {
    --bg: #f6f7f9;
    --paper: #ffffff;
    --line: #e2e5ea;
    --ink: #1c1f24;
    --muted: #6b7280;
    --accent: #2b5cd9;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    justify-content: center;
    min-height: 100vh;
  }
  main { width: 100%; max-width: 44rem; display: flex; flex-direction: column; height: 100vh; }
  header {
    padding: 1rem 1.25rem;
    border-bottom: 1px solid var(--line);
    background: var(--paper);
    display: flex;
    align-items: baseline;
    gap: 0.75rem;
    flex-wrap: wrap;
  }
  h1 { font-size: 1rem; margin: 0; }
  header p { margin: 0; color: var(--muted); font-size: 0.8rem; flex: 1; }
  button {
    font: inherit;
    font-size: 0.8rem;
    padding: 0.3rem 0.7rem;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--paper);
    color: var(--muted);
    cursor: pointer;
  }
  button:hover { color: var(--ink); border-color: var(--muted); }
  #log { flex: 1; overflow-y: auto; padding: 1.25rem; display: flex; flex-direction: column; gap: 0.75rem; }
  .msg { max-width: 85%; padding: 0.6rem 0.85rem; border-radius: 0.9rem; white-space: pre-wrap; }
  .user { align-self: flex-end; background: var(--accent); color: #fff; border-bottom-right-radius: 0.25rem; }
  .bot { align-self: flex-start; background: var(--paper); border: 1px solid var(--line); border-bottom-left-radius: 0.25rem; }
  .err { align-self: stretch; background: #fdeceb; border: 1px solid #f3c2be; color: #8a2018; font-size: 0.85rem; }
  .tools {
    align-self: flex-start;
    font-size: 0.72rem;
    color: var(--muted);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    margin-top: -0.4rem;
  }
  form { display: flex; gap: 0.5rem; padding: 0.85rem 1.25rem; border-top: 1px solid var(--line); background: var(--paper); }
  input {
    flex: 1;
    font: inherit;
    padding: 0.6rem 0.8rem;
    border: 1px solid var(--line);
    border-radius: 999px;
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  form button { border-radius: 999px; padding: 0.5rem 1.1rem; background: var(--accent); color: #fff; border-color: var(--accent); }
  form button:disabled { opacity: 0.5; cursor: default; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Service Request</h1>
    <p>Every question below comes from the Form.io form, not from this page.</p>
    <button id="reset" type="button">Start over</button>
  </header>

  <div id="log" aria-live="polite" aria-label="Conversation"></div>

  <form id="composer">
    <label for="input" class="sr-only" hidden>Message</label>
    <input id="input" autocomplete="off" placeholder="Tell me what you need help with…" required>
    <button id="send" type="submit">Send</button>
  </form>
</main>

<script>
  const log = document.getElementById('log');
  const composer = document.getElementById('composer');
  const input = document.getElementById('input');
  const send = document.getElementById('send');
  const sessionId = Math.random().toString(36).slice(2) + Date.now().toString(36);

  function add(text, className) {
    const el = document.createElement('div');
    el.className = 'msg ' + className;
    el.textContent = text;
    log.appendChild(el);
    log.scrollTop = log.scrollHeight;
    return el;
  }

  function addTools(names) {
    if (!names || !names.length) return;
    const el = document.createElement('div');
    el.className = 'tools';
    // Showing the tool calls is the point of the demo: this is the UAG reading
    // the form and validating the answers.
    el.textContent = 'UAG tools: ' + [...new Set(names)].join(', ');
    log.appendChild(el);
    log.scrollTop = log.scrollHeight;
  }

  async function turn(message) {
    const pending = add('…', 'bot');
    send.disabled = true;
    try {
      const response = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ sessionId, message }),
      });
      const body = await response.json();
      pending.remove();
      if (!response.ok) {
        add(body.error || 'Something went wrong.', 'err');
        return;
      }
      add(body.reply, 'bot');
      addTools(body.toolsUsed);
    } catch (error) {
      pending.remove();
      add('Could not reach the chat server: ' + error.message, 'err');
    } finally {
      send.disabled = false;
      input.focus();
    }
  }

  composer.addEventListener('submit', (event) => {
    event.preventDefault();
    const message = input.value.trim();
    if (!message) return;
    add(message, 'user');
    input.value = '';
    turn(message);
  });

  document.getElementById('reset').addEventListener('click', async () => {
    await fetch('/api/reset', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sessionId }),
    });
    log.innerHTML = '';
    add('Conversation reset. What do you need help with?', 'bot');
  });

  add('Hi! Tell me what you need help with and I will get a service request started.', 'bot');
  input.focus();
</script>
</body>
</html>
