# Yarn 4 defaults to Plug'n'Play, which creates no node_modules. TypeScript is
# not PnP-aware without the Yarn SDKs, so `tsc` cannot resolve @types/* and the
# test script fails with "Cannot find type definition file for 'mocha'". The
# node-modules linker is what this repo has always assumed — .gitignore ignores
# node_modules/ and no PnP artifacts or SDKs are committed.
nodeLinker: node-modules
